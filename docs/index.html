<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assignment Submission Portal (Demo)</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 820px; margin: 30px auto; padding: 0 16px; background: #f5f7fa; color: #222; }
    h1 { color: #1a4d8f; }
    .note { font-size: 13px; color: #555; }
    form, table { background: #fff; border: 1px solid #dde3ea; border-radius: 8px; }
    form { padding: 20px; }
    label { display: block; margin-top: 12px; font-weight: bold; }
    input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; border: 1px solid #bbb; border-radius: 4px; }
    button { margin-top: 16px; padding: 10px 20px; background: #1a4d8f; color: #fff; border: 0; border-radius: 4px; cursor: pointer; }
    .error { background: #fde8e8; color: #9b1c1c; padding: 10px; border-radius: 4px; margin-bottom: 10px; }
    .success { background: #e3f6e8; color: #1e6b34; padding: 10px; border-radius: 4px; margin-bottom: 10px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 8px; border-bottom: 1px solid #eee; text-align: left; font-size: 14px; word-break: break-all; }
    th { background: #eef3f9; }
  </style>
</head>
<body>
  <h1>Assignment Submission Portal</h1>
  <p class="note">Static demo on GitHub Pages (no backend). Submissions are kept in this browser only.
     Deployed automatically only when all CI tests pass on main.</p>
  <div id="msg"></div>
  <form id="f" novalidate>
    <label for="name">Student name</label><input id="name">
    <label for="reg_no">Registration number</label><input id="reg_no" placeholder="FA23-BSE-000">
    <label for="title">Assignment title</label><input id="title">
    <label for="url">Submission URL</label><input id="url" placeholder="https://github.com/you/assignment">
    <button type="submit">Submit</button>
  </form>
  <h2>Saved submissions (<span id="count">0</span>)</h2>
  <table><thead><tr><th>Name</th><th>Reg. No</th><th>Title</th><th>URL</th></tr></thead><tbody id="rows"></tbody></table>
<script>
  const KEY = "submissions";
  const labels = { name: "Name", reg_no: "Registration number", title: "Assignment title", url: "Submission URL" };
  function load() { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { return []; } }
  function store(list) { try { localStorage.setItem(KEY, JSON.stringify(list)); } catch (e) {} }
  let list = load();
  function validUrl(u) { try { const p = new URL(u); return (p.protocol === "http:" || p.protocol === "https:") && !!p.host; } catch (e) { return false; } }
  function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
  function render() {
    document.getElementById("count").textContent = list.length;
    document.getElementById("rows").innerHTML = list.length ? list.map(s =>
      `<tr><td>${esc(s.name)}</td><td>${esc(s.reg_no)}</td><td>${esc(s.title)}</td><td>${esc(s.url)}</td></tr>`).join("")
      : '<tr><td colspan="4">No submissions yet.</td></tr>';
  }
  document.getElementById("f").addEventListener("submit", e => {
    e.preventDefault();
    const data = {}; const errors = [];
    for (const k in labels) { data[k] = document.getElementById(k).value.trim(); if (!data[k]) errors.push(labels[k] + " is required."); }
    if (data.url && !validUrl(data.url)) errors.push("Submission URL is not valid. It must start with http:// or https://");
    const msg = document.getElementById("msg");
    if (errors.length) { msg.className = "error"; msg.innerHTML = errors.map(esc).join("<br>"); return; }
    list.push(data); store(list); render(); e.target.reset();
    msg.className = "success"; msg.textContent = "Submission saved successfully.";
  });
  render();
</script>
</body>
</html>
